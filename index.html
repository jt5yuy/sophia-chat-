<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophia's VIP Live Lounge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1016;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #181a25;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #2a2d3d;
        }
        .header {
            background: linear-gradient(135deg, #ff2a5f, #ff708b);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
            position: relative;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            left: 38px;
            border: 2px solid #181a25;
        }
        .name-status h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .name-status p {
            font-size: 12px;
            color: #ffe6eb;
        }
        .live-badge {
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
        }
        .video-container video, .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .timer-bar {
            background: #ff2a5f;
            color: #fff;
            text-align: center;
            font-size: 13px;
            padding: 6px;
            font-weight: bold;
        }
        .chat-box {
            height: 180px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #13151d;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
        }
        .message.incoming {
            background: #232635;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.outgoing {
            background: #ff2a5f;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .action-area {
            padding: 15px;
            background: #181a25;
            border-top: 1px solid #2a2d3d;
            text-align: center;
        }
        .btn-unlock {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff2a5f, #ff708b);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
            transition: 0.3s;
        }
        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 95, 0.6);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="profile-info">
            <div style="position: relative;">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Sophia" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="name-status">
                <h2>Sophia, 23 🔥</h2>
                <p>Online Now • Private Cam</p>
            </div>
        </div>
        <div class="live-badge">● LIVE</div>
    </div>

    <!-- Video / Teaser Screen -->
    <div class="video-container">
        <!-- আপনি এখানে আপনার কোনো প্রিভিউ ভিডিও বা আকর্ষণীয় ছবি দিতে পারেন -->
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500" alt="Stream Preview" id="streamPreview">
    </div>

    <!-- Timer -->
    <div class="timer-bar" id="timer">Free Access Expires in: 02:00</div>

    <!-- Simulated Chat Box -->
    <div class="chat-box" id="chatBox">
        <div class="message incoming">Hey there! 👋 Welcome to my private room. Are you ready to chat with me?</div>
    </div>

    <!-- Action Button (এখানে আপনার অ্যাডনেটওয়ার্কের Smartlink বা Direct Link বসাবেন) -->
    <div class="action-area">
        <a href="https://auctionr.org/4/16f76d75d75118431887717158c50f66" class="btn-unlock" id="unlockBtn">🔓 Click Here to Start Private Chat</a>
    </div>
</div>

<script>
    // Countdown Timer Logic
    let timeLeft = 120;
    const timerElement = document.getElementById('timer');
    
    const countdown = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.innerHTML = `Free Access Expires in: ${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        timeLeft--;
        if (timeLeft < 0) {
            clearInterval(countdown);
            timerElement.innerHTML = "Session Expired! Verify to Continue.";
        }
    }, 1000);

    // Simulated Chat Messages to keep traffic engaged
    const chatBox = document.getElementById('chatBox');
    const messages = [
        "I'm waiting for your text... Click below to connect! 😉",
        "Make sure to verify so we can start video calling.",
        "Don't leave me hanging here! ❤️"
    ];

    let msgIndex = 0;
    setInterval(() => {
        if(msgIndex < messages.length) {
            setTimeout(() => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message incoming';
                msgDiv.innerText = messages[msgIndex];
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                msgIndex++;
            }, 3000);
        }
    }, 5000);
</script>

</body>
</html>
